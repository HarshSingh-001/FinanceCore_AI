<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FinanceCore AI Chat</title>

  <!-- Existing chat styles (UNCHANGED) -->
  <link rel="stylesheet" href="/static/chat.css" />

  <!-- Page-level theming ONLY -->
  <style>
    body.chat-page {
      margin: 0;
      background: #f5f7fb;
      font-family: "Poppins", Arial, sans-serif;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 60px;
      background: #fffaf4;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #f97316;
    }


        .nav a {
      margin-left: 24px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    .nav .btn {
      background: #f97316;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
    }

    


    /* ===== CHAT WRAPPER POSITIONING ===== */
    .page-wrapper {
      display: flex;
      justify-content: center;
      padding: 40px 20px 20px;
    }

    /* DO NOT MODIFY chat-container styling */
    .chat-container {
      width: 100%;
      max-width: 900px;
    }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body class="chat-page">

<!-- ===== HEADER / NAV ===== -->

<header class="header">
  <div class="logo">FinanceCore-AI</div>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/chat" class="btn">Talk to AI</a>
  </nav>
</header>



<!-- ===== CHAT SECTION (UNCHANGED CORE) ===== -->
<div class="page-wrapper">
  <div class="chat-container">

    <div class="chat-header">
      <span>Finance Guru 🤖</span>
    </div>

    <div class="chat-body"></div>

    <form class="chat-form">
      <textarea
        class="message-input"
        placeholder="Type your message..."
        rows="1"
      ></textarea>

      <button id="send-message" type="submit">➤</button>
    </form>

  </div>
</div>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  © 2026 FinanceCore-AI · Built with AI
</footer>

<!-- ===== SCRIPT (UNCHANGED) ===== -->
<script src="/static/script.js"></script>
</body>
</html>
